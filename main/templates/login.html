{% extends 'base.html' %}

{% block meta %}
<title>Login</title>
{% endblock meta %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-sky-200 to-sky-500">
  <div class="form-style bg-white/95 border-2 border-gray-300 shadow-[0_4px_12px_rgba(0,0,0,0.25)] rounded-2xl p-10 w-full max-w-md backdrop-blur-sm">
    
    <div class="text-center mb-6">
      <h1 class="text-4xl font-bold text-gray-800 drop-shadow-sm mb-2 tracking-tight">
        Welcome!
      </h1>
      <p class="text-gray-600 text-sm italic">Find your spot in Summit Asymptote 💻</p>
    </div>

    <!-- AJAX-based login form -->
  <form id="login-form" method="POST" class="space-y-5">
    {% csrf_token %}

    <div class="space-y-4">

      <!-- Username -->
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input 
        id="username"
        name="username"
        type="text"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors"
        placeholder="Enter your username"
      >

      <!-- Password -->
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input 
        id="password"
        name="password"
        type="password"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors"
        placeholder="Enter your password"
      >

    </div>

    <!-- SUBMIT BUTTON with spinner -->
    <button 
      id="login-btn"
      type="submit"
      class="w-full py-2.5 rounded-xl font-semibold text-white 
            bg-gradient-to-b from-sky-400 to-sky-600 
            border border-sky-700 shadow-inner hover:brightness-110 
            active:scale-95 transition-all duration-300 cursor-pointer
            flex justify-center items-center
            [text-shadow:_0_1px_1px_rgba(0,0,0,0.3)]">
      
      <span id="btn-text">Login</span>

      <svg 
        id="btn-spinner"
        class="hidden ml-2 w-5 h-5 animate-spin text-white"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3.5-3.5L12 0v4a8 8 0 00-8 8h4z"></path>
      </svg>

    </button>
  </form>


    <div class="text-center mt-6 text-gray-700 text-sm">
      Don't have an account yet? 
      <a href="{% url 'main:register' %}" class="text-sky-700 font-semibold hover:underline">Register Now</a>
    </div>
    <div id="loading-overlay" class="hidden"></div>
  </div>
</div>

<!-- Optional manual test button -->
<!-- 
<button
  onclick="showToast('Sample Title', 'This is a sample message for the toast notification.')"
  class="hidden"
>
  Click to Show Toast
</button>
-->

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("login-form");
  const btn = document.getElementById("login-btn");
  const btnText = document.getElementById("btn-text");
  const btnSpinner = document.getElementById("btn-spinner");
  const overlay = document.getElementById("loading-overlay");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    if (!username || !password) {
      showToast("Login Gagal", "Semua field wajib diisi.", "error");
      return;
    }
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const formData = new FormData(form);

    btn.disabled = true;
    btnText.textContent = "Processing...";
    btnSpinner.classList.remove("hidden");
    overlay.classList.remove("hidden");

    fetch("{% url 'main:login' %}", {
      method: "POST",
      headers: { "X-CSRFToken": csrfToken },
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        showToast("Login Berhasil", "Selamat datang kembali!", "success");
        setTimeout(() => window.location.href = "{% url 'main:show_main' %}", 1000);
      } else {
        showToast("Login Gagal", data.error || "Username atau password salah.", "error");
      }
    })
    .catch(() => showToast("Terjadi Kesalahan", "Server tidak merespons", "error"))
    .finally(() => {
      btn.disabled = false;
      btnText.textContent = "Sign In";
      btnSpinner.classList.add("hidden");
      overlay.classList.add("hidden");
    });
  });
});
</script>
{% endblock content %}
