{% extends 'base.html' %}

{% block meta %}
<title>Register</title>
{% endblock meta %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-sky-200 to-sky-500">
  <div class="form-style bg-white/95 border-2 border-gray-300 shadow-[0_4px_12px_rgba(0,0,0,0.25)] rounded-2xl p-10 w-full max-w-md backdrop-blur-sm">

    <!-- Register Title -->
    <div class="text-center mb-6">
      <h1 class="text-4xl font-bold text-gray-800 drop-shadow-sm mb-2 tracking-tight">
        Register
      </h1>
      <p class="text-gray-600 text-sm italic">Create your account and join the Summit 🚀</p>
    </div>

    <!-- AJAX-based Register Form -->
    <form id="register-form" method="POST" class="form-style space-y-5">
    {% csrf_token %}

    <div class="space-y-4">

      <!-- Username -->
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input 
        id="username"
        name="username"
        type="text"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors"
        placeholder="Enter your username"
      >

      <!-- Password 1 -->
      <label for="password1" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input 
        id="password1"
        name="password1"
        type="password"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors"
        placeholder="Enter your password"
      >

      <!-- Password 2 -->
      <label for="password2" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
      <input 
        id="password2"
        name="password2"
        type="password"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors"
        placeholder="Confirm your password"
      >

    </div>

    <!-- Submit Button -->
    <div class="flex justify-center mt-4">
      <button 
        id="register-btn"
        type="submit"
        class="w-3/4 py-3.5 px-3.5 rounded-xl font-semibold text-white 
              bg-gradient-to-b from-sky-400 to-sky-600 
              border border-sky-700 shadow-inner hover:brightness-110 
              active:scale-95 transition-all duration-300 cursor-pointer
              flex justify-center items-center
              [text-shadow:_0_1px_1px_rgba(0,0,0,0.3)]">
        
        <span id="btn-text">Create Account</span>

        <svg id="btn-spinner" 
            class="hidden ml-2 w-5 h-5 animate-spin text-white"
            xmlns="http://www.w3.org/2000/svg" 
            fill="none" 
            viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3.5-3.5L12 0v4a8 8 0 00-8 8h4z"></path>
        </svg>

      </button>
    </div>
  </form>

  <!-- Overlay wajib biar tidak error -->
  <div id="loading-overlay" class="hidden"></div>


    <div class="text-center mt-6 text-gray-700 text-sm">
      Have registered before?
      <a href="{% url 'main:login' %}" class="text-sky-700 font-semibold hover:underline">Login</a>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("register-form");
  const btn = document.getElementById("register-btn");
  const btnText = document.getElementById("btn-text");
  const btnSpinner = document.getElementById("btn-spinner");
  const overlay = document.getElementById("loading-overlay");

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password1 = document.getElementById("password1").value.trim();
    const password2 = document.getElementById("password2").value.trim();

    if (!username || !password1 || !password2) {
      showToast("Gagal", "Semua field wajib diisi.", "error");
      return;
    }

    const formData = new FormData(form);

    btn.disabled = true;
    btnText.textContent = "Processing...";
    btnSpinner.classList.remove("hidden");
    overlay.classList.remove("hidden");

    fetch(form.action, {
      method: "POST",
      body: formData,
      headers: { "X-Requested-With": "XMLHttpRequest" },
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showToast("Registrasi Berhasil", "Akun kamu sudah dibuat!", "success");
          setTimeout(() => window.location.href = "{% url 'main:login' %}", 1500);
        } else {
          showToast("Gagal Registrasi", data.error || "Periksa kembali isian form.", "error");
        }
      })
      .catch(() => showToast("Terjadi Kesalahan", "Server tidak merespons.", "error"))
      .finally(() => {
        btn.disabled = false;
        btnText.textContent = "Create Account";
        btnSpinner.classList.add("hidden");
        overlay.classList.add("hidden");
      });
  });
});
</script>
{% endblock content %}
